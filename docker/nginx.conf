# nginx configuration for the PassAudit web image (docs/docker.md).
#
# Serves the built single-page app and forwards /api/ to the api service on the internal
# network. Two privacy rules are enforced here, not just recommended:
#   * no access log: a request line (URL, query string) must never be written down, because a
#     password pasted into a URL by mistake would otherwise end up in a file;
#   * the Content-Security-Policy below is the one in frontend/csp.ts (a test keeps them equal).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log off;
    # nginx's error log quotes the request line (URL and query string) of whatever failed, so
    # only critical conditions are logged. Start-up notices are unaffected (main context).
    error_log /dev/stderr crit;
    # The API enforces its own (smaller) limits and answers with its own error format.
    client_max_body_size 2m;
    # Request bodies - batches of passwords - must stay in memory. Above this size nginx would
    # spool the body to a temporary file; keeping the buffer at least as large as the limit
    # means that never happens.
    client_body_buffer_size 2m;

    # API: pass everything through untouched. The API sets its own security headers.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $host has no port; the API allow-lists "localhost", "127.0.0.1" and "[::1]".
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # The application. Unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri /index.html;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Assets are content-hashed by the build; the entry page must always be revalidated.
        add_header Cache-Control "no-cache" always;
    }
}
