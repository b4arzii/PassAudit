name: CI

# Runs the same gate as `scripts/check.ps1 -Audit` / `make check`, on Linux and Windows, and
# builds and smoke-tests the container images. It never pushes, publishes or deploys anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format (ruff)
        run: python -m ruff format --check .
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type-check (mypy --strict)
        run: python -m mypy
      - name: Tests (pytest, with coverage)
        run: python -m pytest --cov
      - name: Static security analysis (bandit)
        run: python -m bandit -q -c pyproject.toml -r backend/src

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Type-check and production build
        run: npm run build

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - name: pip-audit
        run: python -m pip_audit
      - name: npm audit
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  docker:
    name: Containers (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Smoke and security checks
        run: python3 docker/smoke_test.py 8080
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
